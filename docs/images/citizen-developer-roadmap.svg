<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Citizen Developer capability roadmap</title><desc id="desc">A proposed roadmap without fixed dates. Now: Guide and onboarding, connected tools, reliable releases. Next: personal memory, role assistants, department knowledge, shared projects and SOPs. Later: automation, tool creation, campus readiness and proactive assistance. Exploring: adaptive experiences.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#b9c3cf" stroke-width="1.5"/></marker></defs>
<rect x="1" y="1" width="1278" height="818" rx="14" fill="#fff" stroke="#d1d9e0"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<text x="32" y="43" fill="#59636e" font-size="12" font-weight="600" letter-spacing="1.6">CITIZEN DEVELOPER</text>
<text x="32" y="79" fill="#1f2328" font-size="28" font-weight="650">From a useful first task to a campus workspace</text>
<text x="32" y="107" fill="#59636e" font-size="15">Proposed priorities across five parts of the experience. Horizons show sequence, not deadlines.</text>
<rect x="246" y="142" width="222" height="70" rx="8" fill="#edf5ff"/><text x="262" y="166" font-size="12" fill="#0969da" font-weight="700" letter-spacing="1.2">NOW</text><text x="262" y="191" font-size="14" fill="#1f2328" font-weight="600">A useful first day</text><path d="M357 222V750" stroke="#e5e9ee" stroke-dasharray="3 6"/><rect x="493" y="142" width="222" height="70" rx="8" fill="#f4f0fc"/><text x="509" y="166" font-size="12" fill="#7551bd" font-weight="700" letter-spacing="1.2">NEXT</text><text x="509" y="191" font-size="14" fill="#1f2328" font-weight="600">Context and collaboration</text><path d="M604 222V750" stroke="#e5e9ee" stroke-dasharray="3 6"/><rect x="740" y="142" width="222" height="70" rx="8" fill="#edf8f4"/><text x="756" y="166" font-size="12" fill="#147567" font-weight="700" letter-spacing="1.2">LATER</text><text x="756" y="191" font-size="14" fill="#1f2328" font-weight="600">Create and scale</text><path d="M851 222V750" stroke="#e5e9ee" stroke-dasharray="3 6"/><rect x="987" y="142" width="222" height="70" rx="8" fill="#f6f8fa"/><text x="1003" y="166" font-size="12" fill="#59636e" font-weight="700" letter-spacing="1.2">EXPLORING</text><text x="1003" y="191" font-size="14" fill="#1f2328" font-weight="600">Learn what works</text><path d="M1098 222V750" stroke="#e5e9ee" stroke-dasharray="3 6"/><rect x="16" y="230" width="1248" height="96" rx="7" fill="#fafbfc"/><text x="32" y="264" fill="#1f2328" font-size="17" font-weight="600">Get started</text><text x="32" y="288" fill="#59636e" font-size="12">Help at the point of need</text><path d="M238 276H1230" stroke="#d8dee6" stroke-width="1.5" marker-end="url(#arrow)"/><text x="32" y="368" fill="#1f2328" font-size="17" font-weight="600">Understand my work</text><text x="32" y="392" fill="#59636e" font-size="12">Context that stays useful</text><path d="M238 380H1230" stroke="#d8dee6" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="16" y="438" width="1248" height="96" rx="7" fill="#fafbfc"/><text x="32" y="472" fill="#1f2328" font-size="17" font-weight="600">Work together</text><text x="32" y="496" fill="#59636e" font-size="12">Knowledge people can trust</text><path d="M238 484H1230" stroke="#d8dee6" stroke-width="1.5" marker-end="url(#arrow)"/><text x="32" y="576" fill="#1f2328" font-size="17" font-weight="600">Create and automate</text><text x="32" y="600" fill="#59636e" font-size="12">Useful tools for real work</text><path d="M238 588H1230" stroke="#d8dee6" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="16" y="646" width="1248" height="96" rx="7" fill="#fafbfc"/><text x="32" y="680" fill="#1f2328" font-size="17" font-weight="600">Serve the campus</text><text x="32" y="704" fill="#59636e" font-size="12">A dependable daily service</text><path d="M238 692H1230" stroke="#d8dee6" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="246" y="238" width="222" height="76" rx="8" fill="#edf5ff" stroke="#0969da" stroke-opacity=".35"/><rect x="246" y="248" width="4" height="56" rx="2" fill="#0969da"/><text x="262" y="267" fill="#1f2328" font-size="14" font-weight="550">TritonAI Guide</text><text x="262" y="287" fill="#1f2328" font-size="14" font-weight="550">Easy onboarding</text><rect x="493" y="342" width="222" height="76" rx="8" fill="#f4f0fc" stroke="#7551bd" stroke-opacity=".35"/><rect x="493" y="352" width="4" height="56" rx="2" fill="#7551bd"/><text x="509" y="371" fill="#1f2328" font-size="14" font-weight="550">Personal memory</text><text x="509" y="391" fill="#1f2328" font-size="14" font-weight="550">Role assistants</text><rect x="987" y="342" width="222" height="76" rx="8" fill="#f6f8fa" stroke="#59636e" stroke-opacity=".35"/><rect x="987" y="352" width="4" height="56" rx="2" fill="#59636e"/><text x="1003" y="386" fill="#1f2328" font-size="14" font-weight="550">Adaptive experiences</text><rect x="493" y="446" width="222" height="76" rx="8" fill="#f4f0fc" stroke="#7551bd" stroke-opacity=".35"/><rect x="493" y="456" width="4" height="56" rx="2" fill="#7551bd"/><text x="509" y="471" fill="#1f2328" font-size="14" font-weight="550">Department knowledge</text><text x="509" y="491" fill="#1f2328" font-size="14" font-weight="550">Shared projects</text><text x="509" y="511" fill="#1f2328" font-size="14" font-weight="550">Practical SOPs</text><rect x="246" y="550" width="222" height="76" rx="8" fill="#edf5ff" stroke="#0969da" stroke-opacity=".35"/><rect x="246" y="560" width="4" height="56" rx="2" fill="#0969da"/><text x="262" y="594" fill="#1f2328" font-size="14" font-weight="550">Connected tools</text><rect x="740" y="550" width="222" height="76" rx="8" fill="#edf8f4" stroke="#147567" stroke-opacity=".35"/><rect x="740" y="560" width="4" height="56" rx="2" fill="#147567"/><text x="756" y="579" fill="#1f2328" font-size="14" font-weight="550">Dependable automation</text><text x="756" y="599" fill="#1f2328" font-size="14" font-weight="550">Build useful tools</text><rect x="246" y="654" width="222" height="76" rx="8" fill="#edf5ff" stroke="#0969da" stroke-opacity=".35"/><rect x="246" y="664" width="4" height="56" rx="2" fill="#0969da"/><text x="262" y="698" fill="#1f2328" font-size="14" font-weight="550">Reliable releases</text><rect x="740" y="654" width="222" height="76" rx="8" fill="#edf8f4" stroke="#147567" stroke-opacity=".35"/><rect x="740" y="664" width="4" height="56" rx="2" fill="#147567"/><text x="756" y="683" fill="#1f2328" font-size="14" font-weight="550">Campus readiness</text><text x="756" y="703" fill="#1f2328" font-size="14" font-weight="550">Proactive assistance</text><path d="M32 765H1248" stroke="#e5e9ee"/>
<text x="32" y="794" fill="#59636e" font-size="13">Throughout: reliability · accessibility · clear permissions · user control</text>
<text x="1248" y="794" fill="#59636e" font-size="12" text-anchor="end">Planned outcomes · Subject to learning</text></g></svg>