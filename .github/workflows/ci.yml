name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Validate Git submodule mappings
        run: node .github/scripts/check-gitlinks.cjs

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      # Share the local gate, including unused-code checks, in one maintained command.
      - name: Preflight checks
        run: vp run preflight:checks

      - name: Release publication guards
        run: node --test .github/scripts/*nightly*.test.cjs .github/scripts/*stable*.test.cjs .github/scripts/prepare-mobile-native.test.cjs .github/scripts/controlled-release-assets.test.cjs
      - name: Install desktop build and credential-store dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config build-essential xvfb dbus-x11 gnome-keyring

      - name: Build and verify desktop pipeline
        run: vp run preflight:desktop

      - name: Open the seeded thread in the built desktop app
        id: desktop_launch
        timeout-minutes: 4
        env:
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          desktop_electron=$(node -p "require('./apps/desktop/node_modules/electron')")
          export desktop_electron
          dbus-run-session -- bash -euo pipefail <<'DESKTOP_SMOKE'
            printf "%s" "ci-desktop-smoke" | gnome-keyring-daemon --unlock --components=secrets
            xvfb-run -a node scripts/smoke-desktop-app.ts --executable "$desktop_electron" --app apps/desktop \
              --artifacts-dir "$RUNNER_TEMP/desktop-launch-check"
          DESKTOP_SMOKE

      - name: Upload desktop launch check
        if: failure() && steps.desktop_launch.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-launch-check
          path: ${{ runner.temp }}/desktop-launch-check
          if-no-files-found: ignore

      - name: Build and verify standalone server executable
        run: VP_NODE_VERSION=26.12.1 node apps/server/scripts/cli.ts build-exe --verbose

  # Everything except `t3` (apps/server). `--parallel` drops the package
  # dependency ordering that `vp run` applies by default: these `test` tasks
  # declare no `dependsOn` and resolve workspace deps from source, so ordering
  # only bought us idle runners between dependency layers. The concurrency
  # limit stays at the default 4 so peak load per runner is unchanged.
  test:
    permissions:
      contents: read
      id-token: write
    name: Test
    runs-on: ubuntu-24.04
    # Include browser/native setup and the expanded v0.1.1 workspace suite.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Install browser secret helper build libraries
        run: |
          sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config build-essential

      - name: Test preview artifact validation
        run: python3 -B .github/scripts/stage-preview-bundle.test.py

      - name: Test nightly release checks
        run: node --test .github/scripts/check-nightly-release.test.cjs .github/scripts/vercel-deployment-output.test.cjs .github/scripts/mobile-preview-comment.test.cjs

      - name: Install Chromium for web browser tests
        run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium

      - name: Test
        run: vp run preflight:tests

      # Browser tests run source modules; this boots the production chunk graph.
      - name: Boot the built web client
        run: |
          vp run --filter @t3tools/web build
          node apps/web/scripts/verify-built-boot.ts

  # apps/server sets `fileParallelism: false`, so its test files run strictly
  # one at a time. Sharding spreads them over separate runners instead of
  # separate workers, so no two server test files ever share a machine and the
  # isolation that flag buys is preserved exactly.
  test_server:
    permissions:
      contents: read
      id-token: write
    name: Test Server ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    # Browser dependency setup can take ten minutes before the serial tests start.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # No Electron setup here: `t3` (apps/server) has no Electron dependency
      # and none of its tests touch the runtime. Only the non-server `test`
      # job, which covers @t3tools/desktop, needs the download.
      - name: Install Chromium for server browser integration tests
        run: node apps/server/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium

      - name: Test
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
        run: vp run preflight:server --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      # src/server.test.ts writes the budget report, so exactly one shard
      # produces these files. Gating the upload on their presence keeps a
      # single `thread-transfer-results` artifact per run, which is the name
      # thread-transfer-report.yml resolves.
      - name: Detect transfer budget report
        id: transfer_budget
        if: always()
        run: |
          if test -f "${{ runner.temp }}/thread-transfer-result.json"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish transfer budget report
        if: always() && steps.transfer_budget.outputs.present == 'true'
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload thread transfer result
        if: always() && steps.transfer_budget.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer-result.json
          if-no-files-found: ignore
          retention-days: 30

  # Split out of Check and Test: both paid ~7-9s to install a Rust toolchain
  # for checks that take under 3s, on the critical path of every PR.
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo fmt --manifest-path "native/$crate/Cargo.toml" -- --check
          done

      - name: Test Rust crates
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo test --locked --manifest-path "native/$crate/Cargo.toml"
          done

  # The static analysis below needs a macOS runner, which bills ~6.7x a Linux
  # minute, so gate it on the native sources it actually lints instead of paying
  # for it on every push. Detection is API-only (no checkout) and fails open: if
  # the diff cannot be resolved, the lint runs.
  mobile_native_changes:
    name: Mobile Native Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Detect mobile native changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail

          fail_open() {
            echo "$* Running native static analysis."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          count_rows() {
            printf '%s\n' "$1" | grep -c . || true
          }

          # One row per changed file, holding the new path and, for a rename,
          # the path it replaced: renaming a matched file out of the matched
          # paths removes a lint input just like editing it.
          row='[.filename, (.previous_filename // empty)] | @tsv'

          if [[ -n "${PR_NUMBER}" ]]; then
            # The PR files endpoint stops at 3000 files and pagination cannot
            # extend it, so cross-check against the count the PR itself reports.
            expected=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files') \
              || fail_open "Could not read the pull request."
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq ".[] | ${row}") \
              || fail_open "Could not resolve changed files."

            listed=$(count_rows "$rows")
            if [[ "$listed" -lt "$expected" ]]; then
              fail_open "GitHub listed only ${listed} of ${expected} changed files."
            fi
          else
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${GITHUB_SHA}" --jq ".files[]? | ${row}") \
              || fail_open "Could not resolve changed files."

            # The compare endpoint reports at most 300 files and pagination does
            # not extend that list, so a full list may be hiding native changes.
            listed=$(count_rows "$rows")
            if [[ "$listed" -ge 300 ]]; then
              fail_open "GitHub listed ${listed} changed files, the compare endpoint maximum."
            fi
          fi

          paths=$(tr '\t' '\n' <<< "$rows")

          # Sources scripts/mobile-native-static-check.ts lints, plus the tool
          # and rule configuration that decides how it lints them, plus the
          # root package.json that defines the lint:mobile command.
          pattern='^apps/mobile/.*\.(swift|kt|kts)$|^apps/mobile/(\.swiftlint\.yml|detekt\.yml|\.editorconfig|Brewfile)$|^scripts/mobile-native-static-check\.ts$|^package\.json$|^\.github/workflows/ci\.yml$'

          if grep -qE "$pattern" <<< "$paths"; then
            echo "Native sources or lint configuration changed:"
            grep -E "$pattern" <<< "$paths"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No mobile native sources or lint configuration changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    needs: mobile_native_changes
    # Skip only on an explicit "no": a gate job that failed or errored leaves the
    # output empty, and that must run the lint rather than silently skip it.
    if: ${{ !cancelled() && needs.mobile_native_changes.outputs.changed != 'false' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        # The filtered install does not include other apps' Vite config dependencies.
        run: node scripts/mobile-native-static-check.ts

  release_smoke:
    permissions:
      contents: read
      id-token: write
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

  desktop_packaging_scope:
    name: Desktop Packaging Scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
      - id: detect
        name: Detect desktop packaging inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/desktop-packaging-scope.cjs

  packaging_wsl:
    name: Package matching WSL runtime
    needs: desktop_packaging_scope
    if: ${{ !cancelled() && needs.desktop_packaging_scope.outputs.changed != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PACKAGING_VERSION: 0.0.0-nightly.20000101.1
      TRITONAI_PLUGIN_COMPOSITION_SOURCE: ${{ github.workspace }}/.release-input/plugins
    steps:
      - &packaging_checkout
        name: Checkout packaging candidate
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |-
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      # Public placeholders exercise the pinned Nightly composition, without
      # giving PR code release credentials or connecting any user accounts.
      - &packaging_plugins
        name: Prepare and validate pinned Nightly plugins
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/prepare-managed-plugins.cjs --production --nightly
          TRITONAI_PLUGIN_CONFIGURATION_JSON="$(node -p "JSON.stringify(require('./.github/fixtures/packaging-plugin-configuration.json'))")"
          export TRITONAI_PLUGIN_CONFIGURATION_JSON
          node scripts/validate-managed-plugin-configuration.ts --receipt .release-input/managed-plugin-validation-receipt.json
          echo "TRITONAI_PLUGIN_CONFIGURATION_JSON=$TRITONAI_PLUGIN_CONFIGURATION_JSON" >> "$GITHUB_ENV"
          node scripts/update-release-package-versions.ts "$PACKAGING_VERSION"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Build and verify the same WSL archive as Nightly
        shell: bash
        run: |
          set -euo pipefail
          vp run --filter t3 build
          VP_NODE_VERSION=26.12.1 node apps/server/scripts/cli.ts build-exe --verbose
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml
          mkdir -p cli-resource-monitor/linux-x64
          cp native/resource-monitor/target/release/t3-resource-monitor cli-resource-monitor/linux-x64/
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$PACKAGING_VERSION" --resource-monitor-dir cli-resource-monitor --output-dir wsl-runtime
          node scripts/smoke-cli-archive.ts --archive "wsl-runtime/t3-$PACKAGING_VERSION-linux-x64.tar.gz" --expect-version "$PACKAGING_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: packaging-check-wsl-runtime
          path: wsl-runtime/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  desktop_packaging:
    name: Package ${{ matrix.label }}
    needs: [desktop_packaging_scope, packaging_wsl]
    if: ${{ !cancelled() && needs.desktop_packaging_scope.outputs.changed != 'false' && needs.packaging_wsl.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS updater ZIP
            runner: macos-15
            platform: mac
            target: zip
            arch: arm64
          - label: Windows installer
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
    env:
      PACKAGING_VERSION: 0.0.0-nightly.20000101.1
      TRITONAI_PLUGIN_COMPOSITION_SOURCE: ${{ github.workspace }}/.release-input/plugins
    steps:
      - *packaging_checkout
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform != 'win' }}
          run-install: false
      - name: Install frozen desktop dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - *packaging_plugins
      - uses: actions/download-artifact@v7
        if: matrix.platform == 'win'
        with:
          name: packaging-check-wsl-runtime
          path: wsl-runtime
      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            throw "Visual Studio Spectre library installation failed."
          }
      - name: Build unsigned candidate with Nightly payload validators
        shell: bash
        run: |
          set -euo pipefail
          args=(--platform "${{ matrix.platform }}" --target "${{ matrix.target }}" --arch "${{ matrix.arch }}"
            --build-version "$PACKAGING_VERSION" --verbose --plugin-configuration-prevalidated
            --plugin-validation-receipt "$GITHUB_WORKSPACE/.release-input/managed-plugin-validation-receipt.json")
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            args+=(--wsl-runtime "$GITHUB_WORKSPACE/wsl-runtime/t3-$PACKAGING_VERSION-linux-x64.tar.gz")
          fi
          vp run dist:desktop:artifact "${args[@]}"
      - name: Verify final updater ZIP permissions
        if: matrix.platform == 'mac'
        shell: bash
        run: node scripts/verify-macos-update-zip.cjs "release/TritonAI-Harness-$PACKAGING_VERSION-arm64.zip"
      - name: Install, upgrade, and boot the Windows candidate
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $installer = (Resolve-Path "release/TritonAI-Harness-$env:PACKAGING_VERSION-x64.exe").Path
          $pluginIds = @((Get-Content .release-input/plugins/manifest.json -Raw | ConvertFrom-Json).packages.id)
          ./scripts/verify-windows-packaged-boot.ps1 -InstallerPath $installer -AllowUnsigned -ExpectedPluginIds $pluginIds

  # Keep the branch-protection name stable while requiring every CI result.
  check:
    name: Check
    if: ${{ always() }}
    needs:
      [
        preflight,
        test,
        test_server,
        rust,
        mobile_native_changes,
        mobile_native_static_analysis,
        release_smoke,
        desktop_packaging_scope,
        packaging_wsl,
        desktop_packaging,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '. as $needs | all(to_entries[];
            .value.result == "success"
            or (.key == "mobile_native_static_analysis"
              and .value.result == "skipped"
              and $needs.mobile_native_changes.result == "success"
              and $needs.mobile_native_changes.outputs.changed == "false")
            or ((.key == "packaging_wsl" or .key == "desktop_packaging")
              and .value.result == "skipped"
              and $needs.desktop_packaging_scope.result == "success"
              and $needs.desktop_packaging_scope.outputs.changed == "false"))' > /dev/null

      - name: Require transfer measurements
        uses: actions/download-artifact@v8
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer
