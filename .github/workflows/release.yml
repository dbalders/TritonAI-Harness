name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.2.3 or v1.2.3)"
        required: true
        type: string
      publish:
        description: "Publish immediately after validation (otherwise leave a draft for testing)"
        required: false
        default: false
        type: boolean

# Keep uploads and publication from racing another controlled release run.
concurrency:
  group: controlled-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  id-token: none

jobs:
  resolve_release:
    name: Resolve controlled draft
    # GitHub hides unpublished drafts from tokens without repository write access.
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_channel: ${{ steps.release_meta.outputs.release_channel }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      ref: ${{ steps.release_meta.outputs.ref }}
    steps:
      - id: release_meta
        name: Resolve release version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw="${DISPATCH_VERSION}"
            if [[ -z "$raw" ]]; then
              echo "workflow_dispatch releases require the version input." >&2
              exit 1
            fi
          else
            raw="${GITHUB_REF_NAME}"
          fi

          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $raw" >&2
            exit 1
          fi

          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+$ ]]; then
            echo "Nightly releases must use the nightly workflow." >&2
            exit 1
          elif [[ "$version" == *-nightly* ]]; then
            echo "Nightly versions must use VERSION-nightly.YYYYMMDD.RUN." >&2
            exit 1
          else
            echo "release_channel=stable" >> "$GITHUB_OUTPUT"
            echo "name=TritonAI Harness v$version" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "ref=v$version" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

      # Keep the controlled release private until every Harness artifact and
      # downstream composition check succeeds.
      - name: Verify controlled release is an unpublished draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          set -euo pipefail

          is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != "true" ]]; then
            echo "Controlled release $RELEASE_TAG must exist as an unpublished draft before starting release automation." >&2
            exit 1
          fi

  preflight:
    name: Preflight
    needs: [resolve_release]
    runs-on: ubuntu-24.04
    # This job runs the full serial suite, unlike the sharded PR/nightly checks.
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      release_channel: ${{ needs.resolve_release.outputs.release_channel }}
      version: ${{ needs.resolve_release.outputs.version }}
      tag: ${{ needs.resolve_release.outputs.tag }}
      release_name: ${{ needs.resolve_release.outputs.release_name }}
      is_prerelease: ${{ needs.resolve_release.outputs.is_prerelease }}
      make_latest: ${{ needs.resolve_release.outputs.make_latest }}
      ref: ${{ needs.resolve_release.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve_release.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run typecheck

      - name: Test
        run: vp run test

      - name: Release publication guards
        run: node --test .github/scripts/*nightly*.test.cjs .github/scripts/controlled-release-assets.test.cjs

  prepare_managed_plugins:
    name: Prepare immutable managed plugin composition
    needs: [preflight]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate managed plugin release pins
        shell: bash
        env:
          INSTALLER_COMMIT: ${{ vars.TRITONAI_INSTALLER_COMPOSITION_COMMIT }}
        run: |
          set -euo pipefail
          [[ "$INSTALLER_COMMIT" =~ ^[a-f0-9]{40}$ ]]

      - name: Checkout pinned composition producer
        uses: actions/checkout@v6
        with:
          repository: dbalders/TritonAI-Installer
          ref: ${{ vars.TRITONAI_INSTALLER_COMPOSITION_COMMIT }}
          fetch-depth: 1
          persist-credentials: false
          path: .release-input/installer

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Prepare pinned managed plugin composition
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix .release-input/installer ci --ignore-scripts
          npm --prefix .release-input/installer run build
          node .release-input/installer/dist/scripts/prepare-plugins-vendor.js --production

      - name: Upload exact pinned composition before provider execution
        uses: actions/upload-artifact@v7
        with:
          name: managed-plugin-composition
          path: .release-input/installer/vendor/plugins
          include-hidden-files: true
          if-no-files-found: error

  validate_managed_plugins:
    name: Validate managed plugins without release credentials
    needs: [preflight, prepare_managed_plugins]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.prepare_managed_plugins.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Download immutable managed plugin composition
        uses: actions/download-artifact@v7
        with:
          name: managed-plugin-composition
          path: .release-input/installer/vendor/plugins

      - name: Execute managed plugin configuration validation
        env:
          TRITONAI_PLUGIN_COMPOSITION_SOURCE: ${{ github.workspace }}/.release-input/installer/vendor/plugins
          TRITONAI_PLUGIN_CONFIGURATION_JSON: ${{ secrets.NIGHTLY_PLUGIN_CONFIGURATION_JSON }}
        run: |
          node scripts/validate-managed-plugin-configuration.ts \
            --receipt .release-input/managed-plugin-validation-receipt.json

      - name: Upload validation receipt
        uses: actions/upload-artifact@v7
        with:
          name: managed-plugin-validation-receipt
          path: .release-input/managed-plugin-validation-receipt.json
          if-no-files-found: error

  # node-pty publishes no Linux prebuilt and the WSL backend runs under the
  # distro's own (Linux) Node, which can't load the Windows/Electron binary. We
  # build the Linux pty.node here, on Linux, and hand it to the Windows packaging
  # job — the Windows artifact then ships a ready WSL backend binary with no
  # cross-compiling and no first-launch compiler/node-gyp/network on the user's
  # machine. node-pty is N-API, so one binary works across all WSL Node versions.
  build_wsl_node_pty:
    name: Build WSL node-pty (linux-x64)
    needs: [preflight]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...

      - name: Build node-pty linux-x64 prebuild
        shell: bash
        run: |
          set -euo pipefail
          # Resolve node-pty from apps/server (where it's a dependency) and build
          # its native binary from source for Linux. node-addon-api resolves from
          # node-pty's own dependency tree, so node-gyp has everything it needs.
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
          file wsl-prebuild/pty.node

      - name: Upload node-pty linux-x64 prebuild
        uses: actions/upload-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error

  build:
    name: Build ${{ matrix.label }}
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    # The Windows package includes this Linux binary for its WSL backend, so the
    # Windows build fails closed if the prerequisite artifact is unavailable.
    needs: [preflight, build_wsl_node_pty, validate_managed_plugins]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.validate_managed_plugins.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 uses the hosted signed/notarized job below.
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
          # - label: Windows arm64
          #   runner: windows-11-arm
          #   platform: win
          #   target: nsis
          #   arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform != 'win' }}
          run-install: false

      - name: Resolve Windows package cache path
        if: matrix.platform == 'win'
        id: package_cache_path
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'

      - name: Cache Windows packages
        if: matrix.platform == 'win'
        uses: actions/cache@v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: windows-release-packages-v1-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor${{ matrix.platform == 'win' && '.exe' || '' }}
          key: resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Download exact validated managed plugin composition
        uses: actions/download-artifact@v7
        with:
          name: managed-plugin-composition
          path: .release-input/installer/vendor/plugins

      - name: Download managed plugin validation receipt
        uses: actions/download-artifact@v7
        with:
          name: managed-plugin-validation-receipt
          path: .release-input

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Download WSL node-pty prebuild
        if: matrix.platform == 'win'
        uses: actions/download-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild

      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Azure Trusted Signing
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          try {
            Install-PackageProvider `
              -Name NuGet `
              -MinimumVersion 2.8.5.201 `
              -Force `
              -Scope CurrentUser `
              -ErrorAction Stop
          } catch {
            Write-Warning "Could not bootstrap NuGet package provider. Continuing because the runner may already have a usable provider. $($_.Exception.Message)"
          }

          Install-Module `
            -Name TrustedSigning `
            -MinimumVersion 0.5.0 `
            -Force `
            -AllowClobber `
            -Repository PSGallery `
            -Scope CurrentUser `
            -ErrorAction Stop

          Import-Module TrustedSigning -MinimumVersion 0.5.0 -Force
          Get-Command Invoke-TrustedSigning -ErrorAction Stop

          $moduleRoots = @(
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "PowerShell", "Modules"),
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "WindowsPowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "PowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "WindowsPowerShell", "Modules")
          )
          $modulePathEntries = @($moduleRoots + ($env:PSModulePath -split ";")) |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -Unique
          "PSModulePath=$($modulePathEntries -join ';')" >> $env:GITHUB_ENV

      - id: build_desktop
        name: Build desktop artifact
        shell: bash
        env:
          TRITONAI_PLUGIN_COMPOSITION_SOURCE: ${{ github.workspace }}/.release-input/installer/vendor/plugins
          TRITONAI_PLUGIN_CONFIGURATION_JSON: ${{ secrets.NIGHTLY_PLUGIN_CONFIGURATION_JSON }}
          UCSD_AI_BASE_URL: ${{ secrets.NIGHTLY_UCSD_AI_BASE_URL }}
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TRUSTED_SIGNING_USE_AZURE_CLI: "true"
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --verbose
            --plugin-configuration-prevalidated
            --plugin-validation-receipt "$GITHUB_WORKSPACE/.release-input/managed-plugin-validation-receipt.json"
          )

          if [[ "${{ matrix.platform }}" == "win" ]]; then
            # Bundle the Linux node-pty binary built by the build_wsl_node_pty job
            # so the packaged WSL backend ships a ready binary (no first-launch
            # compile). Required for a working WSL backend on Windows.
            args+=(--wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node")
            args+=(--signed)
          fi

          vp run dist:desktop:artifact "${args[@]}"

      - name: Verify Windows Authenticode signatures
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $artifacts = @(Get-ChildItem -Path release -Filter *.exe -File | ForEach-Object FullName)
          $encodedArtifacts = [Convert]::ToBase64String(
            [Text.Encoding]::UTF8.GetBytes(($artifacts | ConvertTo-Json -Compress))
          )
          ./scripts/verify-windows-authenticode.ps1 `
            -ExpectedPublisherName $env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME `
            -EncodedPaths $encodedArtifacts

      - name: Install and boot the Windows package
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $artifact = @(Get-ChildItem -Path release -Filter *.exe -File)
          if ($artifact.Count -ne 1) {
            Write-Error "Expected exactly one Windows installer artifact; found $($artifact.Count)."
            exit 1
          }
          $verification = @{
            InstallerPath = $artifact[0].FullName
            ExpectedPluginIds = @((Get-Content .release-input/installer/vendor/plugins/manifest.json -Raw | ConvertFrom-Json).packages.id)
          }
          $verification.ExpectedPublisherName = $env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          ./scripts/verify-windows-packaged-boot.ps1 @verification

      - name: Finalize managed plugin proof
        if: ${{ matrix.platform == 'win' }}
        shell: bash
        run: |
          set -euo pipefail
          proof_input="release/.tritonai-plugin-composition-${{ matrix.platform }}-${{ matrix.arch }}.json.input"
          if [[ ! -f "$proof_input" ]]; then
            echo "Missing managed plugin proof input: $proof_input" >&2
            exit 1
          fi
          artifact="release/TritonAI-Harness-${{ needs.preflight.outputs.version }}-${{ matrix.arch }}.exe"
          node scripts/finalize-managed-plugin-proof.ts \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --artifact "$artifact" \
            --output-dir release

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          for pattern in \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/*.yml" \
            "release/tritonai-plugin-composition-*.json"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

          # Enable if Windows arm64 builds are enabled.
          # Windows updater metadata is channel-specific (for example
          # "latest.yml" or "nightly.yml"). Suffix each per-arch copy so the
          # release job can merge matching arm64/x64 manifests back into one
          # canonical manifest per channel.
          # if [[ "${{ matrix.platform }}" == "win" ]]; then
          #   shopt -s nullglob
          #   for manifest in release-publish/*.yml; do
          #     mv "$manifest" "${manifest%.yml}-win-${{ matrix.arch }}.yml"
          #   done
          # fi

      # The desktop artifact build already fails closed while compiling and
      # staging this binary under packaged resources/resource-monitor. Upstream
      # uploads a separate copy only for its npm CLI package; downstream does
      # not publish that package or expose the raw executable as a release asset.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  mac:
    name: Build signed macOS release
    needs:
      - preflight
      - validate_managed_plugins
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.validate_managed_plugins.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          persist-credentials: false
          sparse-checkout: |-
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Checkout pinned finalizer
        uses: actions/checkout@v6
        with:
          repository: dbalders/TritonAI-Installer
          ref: ${{ vars.TRITONAI_INSTALLER_COMPOSITION_COMMIT }}
          persist-credentials: false
          path: .release-input/installer
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install frozen desktop dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - name: Cache native monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor
          key: resource-monitor-aarch64-apple-darwin-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        with:
          targets: aarch64-apple-darwin
      - uses: actions/download-artifact@v7
        with:
          name: managed-plugin-composition
          path: .release-input/installer/vendor/plugins
      - uses: actions/download-artifact@v7
        with:
          name: managed-plugin-validation-receipt
          path: .release-input
      - name: Stamp release runtime versions
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
      - name: Prepare source once
        env:
          TRITONAI_PLUGIN_COMPOSITION_SOURCE: ${{ github.workspace }}/.release-input/installer/vendor/plugins
          TRITONAI_PLUGIN_CONFIGURATION_JSON: ${{ secrets.NIGHTLY_PLUGIN_CONFIGURATION_JSON }}
          UCSD_AI_BASE_URL: ${{ secrets.NIGHTLY_UCSD_AI_BASE_URL }}
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
        run: |-
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-stage"
          TMPDIR="$RUNNER_TEMP/release-stage/" node scripts/build-desktop-artifact.ts --platform mac --target zip --arch arm64 --keep-stage --stage-only --plugin-configuration-prevalidated --plugin-validation-receipt "$GITHUB_WORKSPACE/.release-input/managed-plugin-validation-receipt.json"
      - name: Import release signing identity
        env:
          CERTIFICATE: ${{ secrets.NIGHTLY_MAC_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.NIGHTLY_MAC_CERTIFICATE_PASSWORD }}
        run: |-
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -hex 24)"
          printf "%s" "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/release.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/release.p12"
      - name: Sign, notarize, and verify packaged app
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.NIGHTLY_DEVELOPER_ID_APPLICATION }}
          APPLE_API_KEY_CONTENT: ${{ secrets.NIGHTLY_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.NIGHTLY_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.NIGHTLY_APPLE_API_ISSUER }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |-
          set -euo pipefail
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          # Keep the key private without making the distributed app owner-only.
          (umask 077; printf "%s" "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY")
          umask 022
          node .release-input/installer/scripts/local-release-mac.cjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/release-stage" "$RELEASE_VERSION" "$GITHUB_WORKSPACE/release"
          node scripts/verify-macos-update-zip.cjs "$GITHUB_WORKSPACE/release/TritonAI-Harness-$RELEASE_VERSION-arm64.zip"
      - name: Remove signing inputs
        if: always()
        run: |-
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/release.p12"
      - name: Upload verified Mac artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-arm64
          path: |-
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/tritonai-plugin-composition-mac-arm64.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Prepare controlled GitHub Release
    needs: [preflight, build, mac]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.build.result == 'success' && needs.mac.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - id: app_token
        name: Mint release app token
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      # - name: Merge Windows updater manifests
      #   run: |
      #     shopt -s nullglob
      #     found_windows_manifest=false
      #     for x64_manifest in release-assets/*-win-x64.yml; do
      #       if [[ "$(basename "$x64_manifest")" == builder-debug-* ]]; then
      #         continue
      #       fi

      #       arm64_manifest="${x64_manifest/-x64.yml/-arm64.yml}"
      #       output_manifest="${x64_manifest/-win-x64.yml/.yml}"
      #       if [[ ! -f "$arm64_manifest" ]]; then
      #         echo "Missing matching arm64 Windows manifest for $x64_manifest" >&2
      #         exit 1
      #       fi

      #       found_windows_manifest=true
      #       node scripts/merge-update-manifests.ts --platform win \
      #         "$arm64_manifest" \
      #         "$x64_manifest" \
      #         "$output_manifest"
      #       rm -f "$arm64_manifest" "$x64_manifest"
      #     done

      #     if [[ "$found_windows_manifest" != true ]]; then
      #       echo "No Windows updater manifests found to merge." >&2
      #       exit 1
      #     fi

      - name: Verify controlled draft gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail

          is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != "true" ]]; then
            echo "Controlled release $RELEASE_TAG is no longer an unpublished draft; refusing to alter it." >&2
            exit 1
          fi

      - name: Attach verified release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail

          required_patterns=(
            "release-assets/*.dmg"
            "release-assets/*.zip"
            "release-assets/*.exe"
            "release-assets/*.blockmap"
            "release-assets/*.yml"
            "release-assets/tritonai-plugin-composition-*.json"
          )
          assets=()
          for pattern in "${required_patterns[@]}"; do
            mapfile -t matches < <(compgen -G "$pattern")
            if (( ${#matches[@]} == 0 )); then
              echo "Required release asset pattern did not match: $pattern" >&2
              exit 1
            fi
            assets+=("${matches[@]}")
          done

          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify final controlled release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir verified-release-assets
          node scripts/verify-controlled-release-assets.cjs verified-release-assets "$RELEASE_VERSION"
          tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          test "$tag_commit" = "$(git rev-parse HEAD)"

      - name: Report draft ready for testing
        if: github.event_name != 'workflow_dispatch' || inputs.publish != true
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          echo "### $RELEASE_TAG is ready for testing" >> "$GITHUB_STEP_SUMMARY"
          echo "The verified assets remain in an unpublished draft. Download and test these exact files, then publish the existing draft without rebuilding." >> "$GITHUB_STEP_SUMMARY"
          echo "Stable users will not receive this draft through automatic updates." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish controlled release
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          IS_PRERELEASE: ${{ needs.preflight.outputs.is_prerelease }}
          MAKE_LATEST: ${{ needs.preflight.outputs.make_latest }}
        run: |
          set -euo pipefail

          edit_args=(--draft=false --verify-tag)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            edit_args+=(--prerelease)
          else
            edit_args+=(--prerelease=false)
          fi
          if [[ "$MAKE_LATEST" == "true" ]]; then
            edit_args+=(--latest)
          else
            edit_args+=(--latest=false)
          fi

          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${edit_args[@]}"

          release_state="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv')"
          expected_state="$(printf 'false\t%s' "$IS_PRERELEASE")"
          if [[ "$release_state" != "$expected_state" ]]; then
            echo "Release publication state mismatch: expected $expected_state, got $release_state." >&2
            exit 1
          fi

  finalize:
    name: Finalize release
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.release.result == 'success' && needs.preflight.outputs.release_channel == 'stable' && github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    needs: [preflight, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - id: app_token
        name: Mint release app token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}
          persist-credentials: true
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: app_bot
        name: Resolve GitHub App bot identity
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...
              - --filter=@t3tools/oxlint-plugin-t3code...

      - id: update_versions
        name: Update version strings
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION" --github-output

      - name: Format package.json files
        if: steps.update_versions.outputs.changed == 'true'
        run: vp fmt apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json

      - name: Refresh lockfile
        if: steps.update_versions.outputs.changed == 'true'
        run: vp install --lockfile-only --ignore-scripts

      - name: Commit and push version bump
        if: steps.update_versions.outputs.changed == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          if git diff --quiet -- apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json pnpm-lock.yaml; then
            echo "No version changes to commit."
            exit 0
          fi

          git config user.name "${{ steps.app_bot.outputs.name }}"
          git config user.email "${{ steps.app_bot.outputs.email }}"

          git add apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json pnpm-lock.yaml
          git commit -m "chore(release): prepare $RELEASE_TAG"
          git push origin HEAD:main

  announce_discord:
    name: Announce release on Discord
    if: |
      always() && !cancelled() &&
      github.event_name == 'workflow_dispatch' && inputs.publish == true &&
      needs.preflight.result == 'success' &&
      needs.release.result == 'success' &&
      (needs.finalize.result == 'success' || needs.finalize.result == 'skipped')
    needs: [preflight, release, finalize]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Announce prerelease on Discord
        if: needs.preflight.outputs.is_prerelease == 'true'
        continue-on-error: true
        env:
          DISCORD_MENTION_ROLE_ID: ${{ secrets.DISCORD_RELEASE_NIGHTLY_ROLE_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          node scripts/notify-discord-release.ts prerelease \
            --role-id "$DISCORD_MENTION_ROLE_ID" \
            --release-name "${{ needs.preflight.outputs.release_name }}" \
            --release-version "${{ needs.preflight.outputs.version }}" \
            --tag "${{ needs.preflight.outputs.tag }}" \
            --release-url "https://github.com/${{ github.repository }}/releases/tag/${{ needs.preflight.outputs.tag }}"

      - name: Announce latest release on Discord
        if: needs.preflight.outputs.make_latest == 'true'
        continue-on-error: true
        env:
          DISCORD_MENTION_ROLE_ID: ${{ secrets.DISCORD_RELEASE_LATEST_ROLE_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          node scripts/notify-discord-release.ts latest \
            --role-id "$DISCORD_MENTION_ROLE_ID" \
            --release-name "${{ needs.preflight.outputs.release_name }}" \
            --release-version "${{ needs.preflight.outputs.version }}" \
            --tag "${{ needs.preflight.outputs.tag }}" \
            --release-url "https://github.com/${{ github.repository }}/releases/tag/${{ needs.preflight.outputs.tag }}"
