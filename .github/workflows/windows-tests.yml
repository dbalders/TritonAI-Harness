# Focused Windows regressions run automatically for filesystem, process,
# terminal, desktop and shared configuration changes. Manual dispatch retains
# arbitrary-package/full-suite investigation without widening the automatic lane.
#
#   gh workflow run windows-tests.yml --ref <branch> -f package=packages/shared
#   gh workflow run windows-tests.yml --ref <branch> -f package=apps/server \
#     -f files="src/process/externalLauncher.test.ts src/cli/theme.test.ts"
#   gh run watch && gh run view --log-failed
name: Windows Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      package:
        description: "Workspace directory to test, e.g. apps/server or packages/shared. Empty runs every package except apps/server."
        type: string
        default: ""
      files:
        description: "Space-separated test files relative to the package directory. Empty runs the package's whole suite. Requires package."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Windows Test Scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      plan: ${{ steps.detect.outputs.plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Select Windows regressions
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TEST_PACKAGE: ${{ inputs.package }}
          TEST_FILES: ${{ inputs.files }}
        run: node .github/scripts/windows-test-scope.cjs

  test:
    name: Windows Regression Tests
    needs: scope
    if: needs.scope.outputs.changed == 'true'
    runs-on: windows-2025
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 45 || 15 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # setup-vp's own cache restores a Linux-shaped store on Windows, which is
      # slower than no cache (see #7975). Cache pnpm's Windows store directly.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve package cache path
        id: package_cache_path
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'

      - name: Cache packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: windows-tests-packages-v1-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install
        run: vp install

      - name: Ensure Electron runtime is installed
        if: github.event_name != 'workflow_dispatch' || inputs.package == '' || inputs.package == 'apps/desktop'
        run: vp run --filter "@t3tools/desktop" ensure:electron

      # `vp run ... test -- <files>` does not forward positional args to vitest,
      # so file-scoped runs call `vp test run` inside the package instead.
      - name: Test
        shell: pwsh
        env:
          TEST_PLAN: ${{ needs.scope.outputs.plan }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Get-Location
          $plan = $env:TEST_PLAN | ConvertFrom-Json
          foreach ($suite in $plan.include) {
            Set-Location $root
            Write-Host "::group::$($suite.label)"
            if ($suite.package -eq '') {
              vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' test
            } elseif ($suite.files -eq '') {
              vp run --filter "./$($suite.package)" test
            } else {
              Set-Location $suite.package
              $testFiles = @($suite.files.Trim() -split '\s+')
              vp test run @testFiles
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host '::endgroup::'
          }
