name: Nightly
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a verified nightly prerelease (never a stable release)
        type: boolean
        default: false
        required: false
  schedule:
    - cron: 17 8 * * *
  push:
    branches:
      - codex/build-speed
    paths:
      - .github/workflows/nightly.yml
      - .github/scripts/*nightly*
      - scripts/*nightly*
      - .gitmodules
permissions:
  contents: read
concurrency:
  group: harness-nightly
  cancel-in-progress: false
env:
  NIGHTLY_INSTALLER_COMMIT: 6446f32aac5e48d5a54a04bc8a8d5936a4f9b971
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
      ref: ${{ steps.resolve.outputs.ref }}
      publish: ${{ steps.resolve.outputs.publish }}
      build: ${{ steps.resolve.outputs.build }}
      stable_version: ${{ steps.resolve.outputs.stable_version }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |-
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - id: resolve
        uses: actions/github-script@v8
        env:
          NIGHTLY_ENABLED: ${{ vars.TRITONAI_NIGHTLY_ENABLED }}
        with:
          script: "await require('./.github/scripts/nightly-release.cjs').resolveNightly({github, context, core, enabled: process.env.NIGHTLY_ENABLED});"
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
        if: steps.resolve.outputs.build == 'true'
      - name: Prepare dated nightly metadata
        id: version
        if: steps.resolve.outputs.build == 'true'
        env:
          STABLE_VERSION: ${{ steps.resolve.outputs.stable_version }}
        run: |-
          set -euo pipefail
          node scripts/update-release-package-versions.ts "$STABLE_VERSION"
          node scripts/resolve-nightly-release.ts --date "$(date -u +%Y%m%d)" --run-number "$GITHUB_RUN_NUMBER" --sha "$GITHUB_SHA" --prepare --github-output
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs:
      - preflight
    if: needs.preflight.outputs.build == 'true'
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          persist-credentials: false
          sparse-checkout: |-
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Ensure Electron
        run: vp run --filter @t3tools/desktop ensure:electron
      - name: Check
        run: vp check
      - name: Typecheck
        run: vp run typecheck
      - name: Nightly publication guards
        run: node --test .github/scripts/*nightly*.test.cjs
      - name: Test
        run: vp run test
  prepare_managed_plugins:
    name: Prepare immutable managed plugin composition
    needs:
      - preflight
    if: needs.preflight.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          persist-credentials: false
          sparse-checkout: |-
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Validate managed plugin release pins
        shell: bash
        env:
          INSTALLER_COMMIT: ${{ env.NIGHTLY_INSTALLER_COMMIT }}
        run: |
          set -euo pipefail
          [[ "$INSTALLER_COMMIT" =~ ^[a-f0-9]{40}$ ]]
      - name: Checkout pinned composition producer
        uses: actions/checkout@v6
        with:
          repository: dbalders/TritonAI-Installer
          ref: ${{ env.NIGHTLY_INSTALLER_COMMIT }}
          fetch-depth: 1
          persist-credentials: false
          path: .release-input/installer
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Prepare pinned managed plugin composition
        shell: bash
        run: |-
          set -euo pipefail
          vp exec tsgo --project .release-input/installer/tsconfig.plugin-producer.json --typeRoots "$GITHUB_WORKSPACE/node_modules/@types"
          node .release-input/installer/dist/scripts/prepare-plugins-vendor.js --production
      - name: Upload exact pinned composition before provider execution
        uses: actions/upload-artifact@v7
        with:
          name: managed-plugin-composition
          path: .release-input/installer/vendor/plugins
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
  validate_managed_plugins:
    name: Validate managed plugins without release credentials
    needs:
      - preflight
      - prepare_managed_plugins
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.prepare_managed_plugins.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          persist-credentials: false
          sparse-checkout: |-
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Download immutable managed plugin composition
        uses: actions/download-artifact@v7
        with:
          name: managed-plugin-composition
          path: .release-input/installer/vendor/plugins
      - name: Execute managed plugin configuration validation
        env:
          TRITONAI_PLUGIN_COMPOSITION_SOURCE: ${{ github.workspace }}/.release-input/installer/vendor/plugins
          TRITONAI_PLUGIN_CONFIGURATION_JSON: ${{ secrets.NIGHTLY_PLUGIN_CONFIGURATION_JSON }}
        run: |
          node scripts/validate-managed-plugin-configuration.ts \
            --receipt .release-input/managed-plugin-validation-receipt.json
      - name: Upload validation receipt
        uses: actions/upload-artifact@v7
        with:
          name: managed-plugin-validation-receipt
          path: .release-input/managed-plugin-validation-receipt.json
          if-no-files-found: error
          retention-days: 3
  build_wsl_node_pty:
    name: Build WSL node-pty (linux-x64)
    needs:
      - preflight
    if: needs.preflight.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          persist-credentials: false
          sparse-checkout: |-
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...
      - name: Build node-pty linux-x64 prebuild
        shell: bash
        run: |
          set -euo pipefail
          # Resolve node-pty from apps/server (where it's a dependency) and build
          # its native binary from source for Linux. node-addon-api resolves from
          # node-pty's own dependency tree, so node-gyp has everything it needs.
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
          file wsl-prebuild/pty.node
      - name: Upload node-pty linux-x64 prebuild
        uses: actions/upload-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error
          retention-days: 3
  build:
    name: Build ${{ matrix.label }}
    needs:
      - preflight
      - build_wsl_node_pty
      - validate_managed_plugins
    if: needs.preflight.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          persist-credentials: false
          sparse-checkout: |-
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform != 'win' }}
          run-install: false
      - name: Resolve Windows package cache path
        if: matrix.platform == 'win'
        id: package_cache_path
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'
      - name: Cache Windows packages
        if: matrix.platform == 'win'
        uses: actions/cache@v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: windows-release-packages-v1-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts... --frozen-lockfile
      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor${{ matrix.platform == 'win' && '.exe' || '' }}
          key: resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}
      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Download exact validated managed plugin composition
        uses: actions/download-artifact@v7
        with:
          name: managed-plugin-composition
          path: .release-input/installer/vendor/plugins
      - name: Download managed plugin validation receipt
        uses: actions/download-artifact@v7
        with:
          name: managed-plugin-validation-receipt
          path: .release-input
      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"
      - name: Download WSL node-pty prebuild
        if: matrix.platform == 'win'
        uses: actions/download-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild
      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }
      - id: windows_signing
        name: Resolve Windows signing mode
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          TRITONAI_ALLOW_UNSIGNED_WINDOWS_RELEASE: "1"
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $ErrorActionPreference = "Stop"

          $signingValues = @(
            $env:AZURE_TENANT_ID,
            $env:AZURE_CLIENT_ID,
            $env:AZURE_CLIENT_SECRET,
            $env:AZURE_TRUSTED_SIGNING_ENDPOINT,
            $env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME,
            $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME,
            $env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          )
          $configuredCount = @(
            $signingValues | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          ).Count

          if ($configuredCount -eq 0) {
            if ($env:TRITONAI_ALLOW_UNSIGNED_WINDOWS_RELEASE -ne "1") {
              Write-Error "Windows signing is unavailable. Set repository variable TRITONAI_ALLOW_UNSIGNED_WINDOWS_RELEASE=1 to authorize an unsigned release."
              exit 1
            }
            "signed=false" >> $env:GITHUB_OUTPUT
            Write-Warning "Azure Trusted Signing is not configured. Building an explicitly unsigned Windows release."
          } elseif ($configuredCount -ne $signingValues.Count) {
            Write-Error "Azure Trusted Signing is partially configured. Provide all seven values or remove all seven."
            exit 1
          } else {
            "signed=true" >> $env:GITHUB_OUTPUT
            Write-Host "Azure Trusted Signing is fully configured. Building a signed Windows release."
          }
      - name: Prepare Azure Trusted Signing
        if: matrix.platform == 'win' && steps.windows_signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          try {
            Install-PackageProvider `
              -Name NuGet `
              -MinimumVersion 2.8.5.201 `
              -Force `
              -Scope CurrentUser `
              -ErrorAction Stop
          } catch {
            Write-Warning "Could not bootstrap NuGet package provider. Continuing because the runner may already have a usable provider. $($_.Exception.Message)"
          }

          Install-Module `
            -Name TrustedSigning `
            -MinimumVersion 0.5.0 `
            -Force `
            -AllowClobber `
            -Repository PSGallery `
            -Scope CurrentUser `
            -ErrorAction Stop

          Import-Module TrustedSigning -MinimumVersion 0.5.0 -Force
          Get-Command Invoke-TrustedSigning -ErrorAction Stop

          $moduleRoots = @(
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "PowerShell", "Modules"),
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "WindowsPowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "PowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "WindowsPowerShell", "Modules")
          )
          $modulePathEntries = @($moduleRoots + ($env:PSModulePath -split ";")) |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -Unique
          "PSModulePath=$($modulePathEntries -join ';')" >> $env:GITHUB_ENV
      - id: build_desktop
        name: Build desktop artifact
        shell: bash
        env:
          TRITONAI_PLUGIN_COMPOSITION_SOURCE: ${{ github.workspace }}/.release-input/installer/vendor/plugins
          TRITONAI_PLUGIN_CONFIGURATION_JSON: ${{ secrets.NIGHTLY_PLUGIN_CONFIGURATION_JSON }}
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
          UCSD_AI_BASE_URL: ${{ secrets.NIGHTLY_UCSD_AI_BASE_URL }}
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --verbose
            --plugin-configuration-prevalidated
            --plugin-validation-receipt "$GITHUB_WORKSPACE/.release-input/managed-plugin-validation-receipt.json"
          )

          if [[ "${{ matrix.platform }}" == "win" ]]; then
            # Bundle the Linux node-pty binary built by the build_wsl_node_pty job
            # so the packaged WSL backend ships a ready binary (no first-launch
            # compile). Required for a working WSL backend on Windows.
            args+=(--wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node")
            if [[ "${{ steps.windows_signing.outputs.signed }}" == "true" ]]; then
              echo "Windows signing enabled (Azure Trusted Signing)."
              args+=(--signed)
            else
              echo "Windows signing unavailable; building the explicit unsigned release path."
            fi
          fi

          vp run dist:desktop:artifact "${args[@]}"
      - name: Verify Windows Authenticode signatures
        if: matrix.platform == 'win' && steps.windows_signing.outputs.signed == 'true'
        shell: powershell
        env:
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $artifacts = @(Get-ChildItem -Path release -Filter *.exe -File | ForEach-Object FullName)
          $encodedArtifacts = [Convert]::ToBase64String(
            [Text.Encoding]::UTF8.GetBytes(($artifacts | ConvertTo-Json -Compress))
          )
          ./scripts/verify-windows-authenticode.ps1 `
            -ExpectedPublisherName $env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME `
            -EncodedPaths $encodedArtifacts
      - name: Install and boot the Windows package
        if: matrix.platform == 'win'
        shell: powershell
        env:
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $artifact = @(Get-ChildItem -Path release -Filter *.exe -File)
          if ($artifact.Count -ne 1) {
            Write-Error "Expected exactly one Windows installer artifact; found $($artifact.Count)."
            exit 1
          }
          $verification = @{
            InstallerPath = $artifact[0].FullName
          }
          if ("${{ steps.windows_signing.outputs.signed }}" -eq "true") {
            $verification.ExpectedPublisherName = $env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          } else {
            $verification.AllowUnsigned = $true
          }
          ./scripts/verify-windows-packaged-boot.ps1 @verification
      - name: Record verified Windows trust mode
        shell: bash
        env:
          NIGHTLY_VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.ref }}
          WINDOWS_SIGNED: ${{ steps.windows_signing.outputs.signed }}
        run: 'node -e ''require("fs").writeFileSync("release/harness-win-verification.json", JSON.stringify({version: process.env.NIGHTLY_VERSION, sourceCommit: process.env.SOURCE_SHA, packagedBoot: true, signingMode: process.env.WINDOWS_SIGNED === "true" ? "signed" : "unsigned"}, null, 2))'''
      - name: Finalize managed plugin proof
        if: ${{ matrix.platform == 'win' }}
        shell: bash
        run: |
          set -euo pipefail
          proof_input="release/.tritonai-plugin-composition-${{ matrix.platform }}-${{ matrix.arch }}.json.input"
          if [[ ! -f "$proof_input" ]]; then
            echo "Missing managed plugin proof input: $proof_input" >&2
            exit 1
          fi
          artifact="release/TritonAI-Harness-${{ needs.preflight.outputs.version }}-${{ matrix.arch }}.exe"
          node scripts/finalize-managed-plugin-proof.ts \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --artifact "$artifact" \
            --output-dir release
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          for pattern in \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/nightly.yml" \
            "release/tritonai-plugin-composition-*.json"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

          # Enable if Windows arm64 builds are enabled.
          # Windows updater metadata is channel-specific (for example
          # "latest.yml" or "nightly.yml"). Suffix each per-arch copy so the
          # release job can merge matching arm64/x64 manifests back into one
          # canonical manifest per channel.
          # if [[ "${{ matrix.platform }}" == "win" ]]; then
          #   shopt -s nullglob
          #   for manifest in release-publish/*.yml; do
          #     mv "$manifest" "${manifest%.yml}-win-${{ matrix.arch }}.yml"
          #   done
          # fi

          cp release/harness-win-verification.json release-publish/
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
          retention-days: 3
  mac:
    name: Build signed macOS nightly
    needs:
      - preflight
      - validate_managed_plugins
    if: needs.preflight.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          persist-credentials: false
          sparse-checkout: |-
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Checkout pinned finalizer
        uses: actions/checkout@v6
        with:
          repository: dbalders/TritonAI-Installer
          ref: ${{ env.NIGHTLY_INSTALLER_COMMIT }}
          persist-credentials: false
          path: .release-input/installer
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install frozen desktop dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - name: Cache native monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor
          key: resource-monitor-aarch64-apple-darwin-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        with:
          targets: aarch64-apple-darwin
      - uses: actions/download-artifact@v7
        with:
          name: managed-plugin-composition
          path: .release-input/installer/vendor/plugins
      - uses: actions/download-artifact@v7
        with:
          name: managed-plugin-validation-receipt
          path: .release-input
      - name: Stamp nightly runtime versions
        env:
          NIGHTLY_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$NIGHTLY_VERSION"
      - name: Prepare source once
        env:
          TRITONAI_PLUGIN_COMPOSITION_SOURCE: ${{ github.workspace }}/.release-input/installer/vendor/plugins
          TRITONAI_PLUGIN_CONFIGURATION_JSON: ${{ secrets.NIGHTLY_PLUGIN_CONFIGURATION_JSON }}
          UCSD_AI_BASE_URL: ${{ secrets.NIGHTLY_UCSD_AI_BASE_URL }}
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
        run: |-
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nightly-stage"
          TMPDIR="$RUNNER_TEMP/nightly-stage/" node scripts/build-desktop-artifact.ts --platform mac --target zip --arch arm64 --keep-stage --stage-only --plugin-configuration-prevalidated --plugin-validation-receipt "$GITHUB_WORKSPACE/.release-input/managed-plugin-validation-receipt.json"
      - name: Import nightly signing identity
        env:
          CERTIFICATE: ${{ secrets.NIGHTLY_MAC_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.NIGHTLY_MAC_CERTIFICATE_PASSWORD }}
        run: |-
          set -euo pipefail
          keychain="$RUNNER_TEMP/nightly.keychain-db"
          password="$(openssl rand -hex 24)"
          printf "%s" "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/nightly.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/nightly.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/nightly.p12"
      - name: Sign, notarize, and verify packaged app
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.NIGHTLY_DEVELOPER_ID_APPLICATION }}
          APPLE_API_KEY_CONTENT: ${{ secrets.NIGHTLY_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.NIGHTLY_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.NIGHTLY_APPLE_API_ISSUER }}
          NIGHTLY_VERSION: ${{ needs.preflight.outputs.version }}
        run: |-
          set -euo pipefail
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          umask 077
          printf "%s" "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
          node .release-input/installer/scripts/local-release-mac.cjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/nightly-stage" "$NIGHTLY_VERSION" "$GITHUB_WORKSPACE/release"
      - name: Remove signing inputs
        if: always()
        run: |-
          security delete-keychain "$RUNNER_TEMP/nightly.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/nightly.p12"
      - name: Upload verified Mac artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-arm64
          path: |-
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/nightly-mac.yml
            release/tritonai-plugin-composition-mac-arm64.json
            release/harness-mac-verification.json
          if-no-files-found: error
          retention-days: 3
  publish:
    name: Publish nightly only
    needs:
      - preflight
      - verify
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - &a1
        name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          persist-credentials: false
          sparse-checkout: |-
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: verified-nightly-release
          path: release-assets
      - name: Publish verified nightly prerelease
        uses: actions/github-script@v8
        env:
          NIGHTLY_TAG: ${{ needs.preflight.outputs.tag }}
          NIGHTLY_NAME: ${{ needs.preflight.outputs.name }}
          SOURCE_SHA: ${{ needs.preflight.outputs.ref }}
        with:
          script: await require('./.github/scripts/publish-nightly.cjs')({github, context});
  verify:
    name: Verify both nightly artifact sets
    needs:
      - preflight
      - quality
      - build
      - mac
    if: needs.preflight.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - *a1
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Validate nightly asset contract
        env:
          NIGHTLY_VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.ref }}
        run: node scripts/validate-nightly-assets.cjs release-assets "$NIGHTLY_VERSION" "$SOURCE_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: verified-nightly-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3
